name = "math"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Basics", "Naturals", "Integers", "Geometry"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc2"

[[lean_lib]]
name = "Basics"
globs = ["Basics.+"]

[[lean_lib]]
name = "Naturals"
globs = ["Naturals.+"]

[[lean_lib]]
name = "Integers"
globs = ["Integers.+"]

[[lean_lib]]
name = "Geometry"
globs = ["Geometry.+"]
